<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SAMURAI - Anime Streaming & Manga Reading Platform</title>
    <meta name="description" content="Stream thousands of anime episodes and read manga chapters for free. Discover trending anime, airing schedules, and curated recommendations." />
    <meta name="author" content="Ekansh Agarwal" />
    <meta property="og:title" content="SAMURAI - Anime Streaming & Manga" />
    <meta property="og:description" content="Your ultimate destination for anime streaming and manga reading." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://www.termsfeed.com/public/cookie-consent/4.2.0/cookie-consent.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        if (typeof cookieconsent !== 'undefined') {
          cookieconsent.run({
            notice_banner_type: "simple",
            consent_type: "express",
            palette: "dark",
            language: "en",
            page_load_consent_levels: ["strictly-necessary"],
            notice_banner_reject_button_hide: false,
            preferences_center_close_button_hide: false,
            page_refresh_confirmation_buttons: false
          });
        }
      });
    </script>
  </body>
</html>
